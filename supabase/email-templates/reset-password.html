<!-- Supabase → Authentication → Emails → Templates → "Reset Password". Subject: Reset your Unify password -->
<div style="font-family:Inter,Arial,sans-serif;max-width:440px;margin:0 auto;padding:28px 24px;background:#f5f5f0;border-radius:20px;color:#0a0a0a">
  <div style="font-family:Georgia,serif;font-weight:700;font-size:20px">Unify Learn</div>
  <h1 style="font-size:22px;margin:22px 0 8px">Reset your password</h1>
  <p style="font-size:15px;line-height:1.5;margin:0 0 18px;color:#333">Tap the button on this phone to choose a new password.</p>
  <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#50ff90;color:#0a0a0a;font-weight:700;font-size:15px;text-decoration:none;border-radius:24px;padding:13px 22px">Choose a new password</a>
  <p style="font-size:13px;line-height:1.5;margin:18px 0 0;color:#777">If you didn't ask for this, ignore this email. Your password stays the same.</p>
</div>
